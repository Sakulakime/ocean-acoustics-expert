# Note paths are relative to the knowledge-base root. Chapter spans and
# fallback windows written as a page range (20-39) are PDF page ranges of the
# primary source, whose PDF is primary_source_pdf (see 01-source-coa.md).
# A fallback window into another book is a mapping: source is that book's
# source note, which names its PDF and maps its sections to pages, and pages
# is a PDF page range of that PDF.
primary_source: 01-source-coa.md
primary_source_pdf: sources/jensen-2011-computational-ocean-acoustics.pdf
policy:
  default_order:
    - read 00-hub.md
    - read routing-map.yaml
    - check concept-index.yaml for the concepts the prompt names
    - read the smallest relevant note set (chapter, solver, runbook and visualization notes, plus benchmark cases and book source notes when present)
    - read a targeted page range of a book PDF in sources/ only if the notes are insufficient
  answer_requirements:
    - separate physical assumptions from numerical assumptions
    - say when the method is appropriate and when it is not
    - cite note paths and PDF ranges used
    - "tag every claim [textbook: <source> <section/pages>] or [inference]"
routes:
  visualization:
    trigger_keywords: [plot, plotting, visualization, visualize, figure, colormap, colorbar, caxis, clim, color scale, color bar, dynamic range, jet_r, plotshd, TL plot, field plot, imagesc, pcolor, 画图, 绘图, 可视化, 色标, 色棒, 色图, 颜色范围, 动态范围, 出图]
    notes:
      - visualization.md
    source_refs:
      at2020_plotshd: "{{at_2020}}/Matlab/Plot/plotshd.m"
    note: TL/场可视化权威规范——色标范围按 AT2020 plotshd.m 自适应算(median+0.75std, 50dB窗口),多图对比共用同一 caxis,离散标签不用连续色标。涉及任何 TL/声场出图、色标、配色问题必读此 note。
